contractVersion: 1
run:
  id: 2026-08-17-identify-predictive-selection-signals
  question: >
    For each working clinician-quality domain, which signals available at prospect prioritization, pre-contract qualification, onboarding, cold-start matching, and longitudinal monitoring predict later observed performance, and which commonly used signals add little valid information or introduce bias?
  synthesis: >
    The evidence favors progressive measurement over a one-time screening score. Before care begins, the strongest psychotherapy-specific signal is performance-based interpersonal skill observed under challenging conditions; static resume variables such as years of experience, training stage, highest qualification, theoretical orientation, and self-rated social skill are weak or inconsistent predictors of patient outcome and should not become quality rankings without local prospective validation. Modality-specific competence and adherence may establish capability in some settings, but their relationship with outcomes is inconsistent across adult and youth studies. Once care begins, alliance, rapport, and patient-reported experience provide earlier and more direct evidence about the care-effectiveness domain, while risk-adjusted longitudinal outcomes become the strongest basis for estimating contextual clinician strengths. A randomized trial shows that matching patients using therapists' empirically derived historical strengths can improve outcomes. Feedback and routine outcome monitoring can themselves improve care and narrow therapist variability, so responsiveness to platform feedback is best treated as a clinician-system interaction signal with the support context preserved. External evidence is thin for predicting platform operating reliability from pre-contract variables; scheduling, documentation, workflow, and support-response signals should therefore be validated prospectively against operating outcomes inside the platform rather than treated as clinical-quality proxies.
  createdAt: 2026-08-17
  preparedBy:
    kind: conversational-agent
    provider: openai
    model: gpt-5.6-sol
  provenance:
    method: public-research
    context: >
      Built from the current longitudinal clinician-profile reflection and a targeted evidence pass prioritizing recent systematic reviews, meta-analyses, prospective studies, and matching trials. The matrix separates care effectiveness and relationship, adaptive clinical practice, and operating partnership reliability; contextual strength conditions those domains rather than standing as another scalar score.
  safety:
    containsSensitiveData: false
    containsPrivateCompanyMaterial: false
    rawTranscriptIncluded: false
  answers: [identify-predictive-selection-signals]
