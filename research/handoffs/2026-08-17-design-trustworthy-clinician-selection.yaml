findings:
  - id: finding-progressive-selection-needs-different-decision-modes
    statement: >
      A cost-efficient selection system should distinguish true eligibility gates from predictive assessments: inexpensive stages can reduce the pool before expensive evaluation, but treating every predictor as a knockout hurdle can reduce selection quality because useful evidence that could compensate for a weaker signal is discarded.
    sourceIds:
      - source-multiple-hurdle-utility-2018
      - source-selection-review-2023
      - source-opm-assessment-strategy
    suggestedTargets: [scarce-review-time-without-comparable-evidence, screen-candidates, select-clinician]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      The utility simulation is not clinician-specific and depends on predictor validity, assessment cost, and selectivity. It supports a cost-quality tradeoff rather than one universal sequence or cutoff.
  - id: finding-structure-expensive-human-evaluation
    statement: >
      When human evaluation is used, it should be structured around job-relevant constructs, common prompts, and explicit scoring criteria rather than relying on an unstructured overall impression; updated meta-analytic evidence places structured interviews among the strongest general predictors of later job performance.
    sourceIds:
      - source-selection-validity-revision-2022
      - source-selection-review-2023
    suggestedTargets: [scarce-review-time-without-comparable-evidence, select-clinician]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      General personnel-selection validity does not establish which clinician-specific constructs or scenarios should be assessed. The earlier predictive-signal research remains necessary for choosing the content of a clinician evaluation.
  - id: finding-explicit-combination-beats-holistic-synthesis
    statement: >
      Once multiple pieces of evidence have been collected, explicit mechanical combination generally predicts later performance better than holistic expert synthesis, so human review should not depend on reviewers privately re-weighting the same evidence into an overall feeling about the candidate.
    sourceIds:
      - source-mechanical-combination-2013
    suggestedTargets: [scarce-review-time-without-comparable-evidence, screen-candidates, select-clinician]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      Mechanical combination requires validated inputs and an appropriate criterion. This finding does not justify an opaque machine-learning score or eliminate human judgment when the available evidence is incomplete, novel, or incorrectly represented.
  - id: finding-candidate-experience-affects-selection-outcomes
    statement: >
      Candidate experience is an operating outcome of the selection system rather than a cosmetic layer: perceived fairness and job relevance are associated with organizational attractiveness and offer-related intentions and behavior, and explanations can improve fairness perceptions even when the selection outcome is unfavorable.
    sourceIds:
      - source-applicant-reactions-review-2017
      - source-explanations-meta-2009
      - source-selection-review-2023
    suggestedTargets: [attract-candidates, screen-candidates, select-clinician, scarce-review-time-without-comparable-evidence]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      Most applicant-reaction research is not specific to independent behavioral-health clinicians considering network contracts. The direction is transferable, but the relative importance of speed, human contact, autonomy, and professional respect should be tested with this population.
  - id: finding-automation-is-stronger-for-standardized-collection-than-unvalidated-rejection
    statement: >
      Current evidence provides a stronger basis for automating standardized information collection and routing than for delegating final selection to an opaque model: a large recent field experiment found AI-led interviews collected more hiring-relevant information and improved downstream hiring outcomes while humans retained the hiring decision, whereas applicant-perception studies show algorithm-only hiring can be viewed as less fair than human or human-assisted processes.
    sourceIds:
      - source-voice-ai-field-2026
      - source-algorithm-fairness-2023
      - source-ai-explanations-2025
    suggestedTargets: [scarce-review-time-without-comparable-evidence, screen-candidates, select-clinician]
    classification: new
    evidenceStance: contextualizes
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      The field experiment is a working paper involving high-volume entry-level customer-service hiring in the Philippines, not clinician contracting. Studies of perceived algorithmic fairness also disagree by interface and context. The transferable claim is about standardization as a plausible automation benefit, not that an AI interviewer will improve clinician selection.
  - id: finding-consequential-screening-needs-purpose-specific-validation
    statement: >
      A screening rule should be validated for the decision it actually makes, monitored for differential exclusion, and compared with less harmful alternatives when it has consequential effects; this is especially important for early-stage automation because candidates removed there may never generate downstream evidence that reveals a false negative.
    sourceIds:
      - source-eeoc-selection-guidance
      - source-selection-review-2023
    suggestedTargets: [scarce-review-time-without-comparable-evidence, screen-candidates, selection-accuracy]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      Legal requirements vary by jurisdiction and employment or contracting status. The generalized operating principle is to validate consequential screening and monitor error and group effects rather than assuming that automation is neutral.
  - id: finding-human-review-allocation-is-a-design-inference
    statement: >
      The evidence supports treating scarce human review as an information-allocation problem: the likely high-leverage cases are prospects for whom existing evidence is consequentially incomplete, contradictory, or close enough to a decision boundary that additional structured judgment could change the action, rather than every candidate who clears a basic screen.
    sourceIds:
      - source-multiple-hurdle-utility-2018
      - source-mechanical-combination-2013
      - source-selection-review-2023
    suggestedTargets: [scarce-review-time-without-comparable-evidence, screen-candidates, select-clinician]
    classification: new
    evidenceStance: inference
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      This allocation rule is an inference from selection utility and evidence-combination research, not a directly validated clinician-selection policy. The platform should test whether an uncertainty-and-value-based review queue improves selection accuracy per reviewer hour versus simpler ranking or FIFO approaches.
notes:
  - id: note-hard-gates-versus-predictive-signals
    statement: >
      The emerging workflow should distinguish noncompensable requirements such as true eligibility constraints from predictive signals whose weaknesses may be offset by stronger evidence elsewhere. The interface should make that difference visible rather than representing every criterion as an equal checklist item.
    sourceIds: [source-multiple-hurdle-utility-2018, source-opm-assessment-strategy]
    anchors: [scarce-review-time-without-comparable-evidence, design-trustworthy-clinician-selection]
  - id: note-reviewer-role-shifts-from-ranking-to-exception-handling
    statement: >
      If comparable signals are collected and combined explicitly, the human reviewer's distinctive role becomes gathering missing evidence, interpreting cases the structured system cannot resolve, noticing representation errors, and making accountable exceptions rather than manually ranking every prospect from scratch.
    sourceIds: [source-mechanical-combination-2013, source-selection-review-2023]
    anchors: [select-clinician, design-trustworthy-clinician-selection]
  - id: note-candidate-facing-explanations-are-low-cost-control
    statement: >
      Explaining why an assessment is relevant, what happens next, and how the information contributes to the process is a comparatively low-cost candidate-experience control supported across older and newer applicant-reaction research.
    sourceIds: [source-explanations-meta-2009, source-ai-explanations-2025]
    anchors: [attract-candidates, screen-candidates, select-clinician]
  - id: note-source-channels-should-be-valued-by-usable-evidence
    statement: >
      For this model, candidate-generation channels should eventually be compared not only by prospect volume but by how much trustworthy, reusable evidence they contribute before the clinician is asked to do additional work and by the downstream quality of the candidates they produce.
    sourceIds: [source-selection-review-2023]
    anchors: [source-candidates, attract-candidates, candidate-yield]
  - id: note-ai-field-experiment-is-prototype-relevant-not-policy
    statement: >
      The recent voice-AI field experiment is particularly relevant to prototyping because the automation changed who collected structured evidence while keeping human decision authority constant. It is useful precedent for testing an AI-assisted evidence-gathering interaction, but its outcome estimates should not be imported into a clinician network forecast.
    sourceIds: [source-voice-ai-field-2026]
    anchors: [design-trustworthy-clinician-selection, scarce-review-time-without-comparable-evidence]
questions:
  - id: question-auto-stop-boundary
    question: Which pre-contract conditions are truly noncompensable eligibility gates, and which should remain evidence that can be outweighed or sent to human review?
  - id: question-human-review-trigger
    question: What review-priority rule produces the best selection accuracy per reviewer hour: uncertainty, expected value of additional information, predicted quality, network need, or a combination?
  - id: question-selection-experience-minimum
    question: What minimum candidate-experience controls should every automated or human-assisted stage provide, including explanation, status visibility, opportunity to demonstrate capability, response timing, and access to a person for consequential ambiguity?
  - id: question-stage-level-false-negatives
    question: How can the platform estimate false negatives at early screening stages when rejected prospects normally produce no downstream quality data?
  - id: question-clinician-ai-collection
    question: Would clinicians accept an automated conversational evidence-gathering step if it were clearly bounded to information collection and summary rather than final selection, and what interaction design would preserve professional trust?
