contractVersion: 1
run:
  id: 2026-08-18-system-map-connection-depth-reflection
  kind: reflection
  reflectsOn:
    - 2026-08-15-candidate-problems-readiness-and-matching
    - 2026-08-17-clinician-quality-profile-reflection
  question: >
    What does the current canonical model already say about what crosses stage boundaries, return paths, and learning loops, what can the system map show without inventing new claims, and which remaining connection questions are worth investigating next?
  synthesis: >
    The current model is already materially richer than its stage-to-stage arrows. Cross-stage Step `next` links carry specific work between Clinician Supply and Onboarding, Onboarding and Matching, Matching and Care Initiation, Care Initiation and Practice Operations, and Practice Operations and Retention & Growth. Some of those transitions also carry explicit Entity states, while Care Initiation records several failure routes that return toward Matching. Quality & Outcomes is different: its canonical prose describes observation, interpretation, attribution, and feedback into earlier decisions, while the process graph also carries a direct Practice Operations to Retention & Growth path. That makes it an open modelling question whether Quality & Outcomes is primarily a sequential stage, a cross-cutting learning layer, or both. Participant experience is thinner still. The model names actors, mutual decisions, burden-sensitive exceptions, and several experience-related research questions, but it does not yet define a stable cross-boundary experience payload that can be drawn as though it were known. The useful next map therefore distinguishes what is authored, what is mechanically derived from authored process/state, and what remains an explicit gap. Existing Problems and queued questions already cover much of the uncertainty around selection handoff, matching quality, authority, failed transitions, and performance attribution, so this reflection points back to those rather than creating duplicates.
  createdAt: 2026-08-18
  preparedBy:
    kind: conversational-agent
    provider: openai
    model: gpt-5.6-sol
  provenance:
    method: repository-reflection
    context: >
      Reviewed current main after the system-map layer and topology changes, including canonical map topology, cross-stage Steps and Entity states, Quality & Outcomes, canonical Problems, queued research questions, and the two prior reflections named above. No new external evidence was gathered.
  safety:
    containsSensitiveData: false
    containsPrivateCompanyMaterial: false
    rawTranscriptIncluded: false
