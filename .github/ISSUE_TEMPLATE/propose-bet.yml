name: Propose a Bet
description: An intervention we believe may improve part of the operating machinery.
labels: ["bet"]
body:
  - type: markdown
    attributes:
      value: |
        A Bet is the bridge between systems thinking and working software.
        It can exist long before a prototype does.

        Every Bet answers one Problem. If the problem is not written down yet,
        open a **Name a Problem** issue first — that is a contribution in its
        own right, and this bet will have something to attach to.

  - type: input
    id: title
    attributes:
      label: Bet
      description: Short name for the intervention.
      placeholder: Guided First Caseload
    validations:
      required: true

  - type: input
    id: problem
    attributes:
      label: Problem ID
      description: The existing Problem this answers, from `content/problems/`.
      placeholder: activation-without-productivity
    validations:
      required: true

  - type: textarea
    id: bet
    attributes:
      label: The bet
      description: What intervention do we think may improve it?
    validations:
      required: true

  - type: input
    id: metrics
    attributes:
      label: Metrics that would tell us it worked
      description: Existing metric IDs, or describe metrics we would need to create.
      placeholder: time-to-first-match, time-to-first-session

  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options: [low, medium, high]
    validations:
      required: true
