name: Validate

# The canonical model lives in `content/`. This workflow is the gate that keeps
# invalid or unreferenced system thinking from entering the repository, since
# the intended trust model is: propose a change -> human reviews -> Git accepts.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Content first: a schema or cross-reference error is the most likely
      # failure for a model-only change, and it produces the clearest message.
      - name: Validate content
        run: npm run validate:content

      - name: Validate research intake
        run: npm run validate:research

      - name: Test research intake
        run: npm run test:research

      # The build packet's refusal is the part worth protecting: an agent that
      # gets a brief for an unshaped bet will build against invented answers.
      - name: Test prototype brief
        run: npm run test:prototype

      # Contributions arrive here from conversations held elsewhere. This looks
      # for the shapes of things that must never be in a public repository —
      # credentials, contact details, patient identifiers, confidentiality
      # markers carried over from an internal document.
      - name: Scan for confidential material
        run: npm run scan:safety

      - name: Lint
        run: npm run lint

      # Brand values belong in `app/design-system.css` and nowhere else. This
      # is what keeps the design system true of work added later.
      - name: Lint design system
        run: npm run lint:design

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # A thin responsive smoke test at two viewports. It builds and serves the
      # app itself, so it runs last and covers what the earlier steps cannot:
      # whether the thing still fits on a phone.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Responsive tests
        run: npm run test:responsive
