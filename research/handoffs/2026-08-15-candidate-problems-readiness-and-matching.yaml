contractVersion: 1
run:
  id: 2026-08-15-candidate-problems-readiness-and-matching
  kind: reflection
  question: "Which of the readiness, matching, and first-care-transition troubles named in the 2026-08-14 adversarial deep dive should the model record as canonical Problems?"
  synthesis: >
    A conversion, not an analysis. The adversarial deep dive of 2026-08-14 ranked eight candidate Problems across
    harm, breadth, uncertainty, prototypeability and learning value, and wrote falsification prompts for its top
    three. That work is already done and already reviewed prose; what it has never had is a form anything can order,
    count, or decide. It sits in a 45 KB Markdown file that the queue cannot see, the map cannot draw, and /review
    cannot rank, which is why it has stayed unconverted since the day it was written. This reflection carries each
    candidate across verbatim, with the deep dive's own ranking and reasoning attached, so that a person can accept
    or reject them one at a time at whatever pace suits. Nothing here is new thinking. No candidate is named, no
    target was inferred beyond the stages and steps the deep dive itself discusses, and nothing rests on a Claim
    that the deep dive did not already rest on — which is none of them. The deep dive is explicit that these are
    candidate framings and not canonical Problems, and accepting one still composes only a skeleton for a person
    to write.
  createdAt: 2026-08-15
  preparedBy:
    kind: coding-agent
    provider: Anthropic
  provenance:
    method: repository-reflection
    context: >
      Structured re-expression of an existing repository document. No external sources were read, no new evidence
      was gathered, and no ranking was recomputed. Scores and the "why it ranks here" reasoning are the deep dive's;
      falsification text is carried where the deep dive supplied it, and marked absent where it did not.
  safety:
    containsSensitiveData: false
    containsPrivateCompanyMaterial: false
    rawTranscriptIncluded: false
sources:
  - id: source-readiness-matching-deep-dive
    identity: repo-adversarial-deep-dive-readiness-matching-2026-08-14
    kind: repository
    title: "Adversarial deep dive: readiness, matching, and the first care transition"
    locator:
