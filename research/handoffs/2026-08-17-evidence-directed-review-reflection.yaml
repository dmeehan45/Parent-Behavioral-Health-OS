notes:
  - id: note-prospect-generation-out-of-scope
    statement: >
      The first selection-workspace prototype starts from a clinician prospect already in the pool. Role posting, outbound sourcing, inbound prospect generation, and the machinery that creates prospect volume are a separate workstream and should not be implied by the word prospect in this prototype.
    sourceIds: [source-trustworthy-selection-run]
    anchors: [scarce-review-time-without-comparable-evidence, evidence-directed-clinician-review]
  - id: note-clinician-automation-needs-human-presence
    statement: >
      Clinician-facing automation should be designed as human-backed augmentation. If technology gathers additional evidence, the experience should preserve a visible human relationship, explain why the automated step exists, and avoid branding the interaction as AI interviewing or autonomous selection.
    sourceIds: [source-trustworthy-selection-run]
    anchors: [evidence-directed-clinician-review, design-trustworthy-clinician-selection]
candidates:
  - id: candidate-human-backed-selection-experience-question
    kind: question
    description: >
      Determine which forms of human presence, explanation, timing, and access to a person are sufficient for clinicians to experience automated evidence collection as support for a relationship rather than replacement of one.
    targets: []
    restsOn: []
    rationale: >
      The research supports candidate experience as consequential but does not tell us what human-backed augmentation should look like for independent behavioral-health clinicians. The first prototype can expose this uncertainty without solving it in advance.
    wouldWeakenIf: >
      Clinician testing shows that bounded automated evidence collection is accepted equally well without any visible human presence or relationship cue.
