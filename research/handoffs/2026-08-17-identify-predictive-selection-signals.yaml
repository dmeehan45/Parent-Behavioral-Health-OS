findings:
  - id: finding-performance-based-interpersonal-skills-predict
    statement: >
      Performance-based assessments of therapist interpersonal skill under challenging clinical interactions are a promising pre-care predictor of later patient outcomes and are better supported than self-rated social skill.
    sourceIds:
      - source-therapist-effect-review-2026
      - source-effective-therapist-characteristics-2020
      - source-fis-prospective-2016
      - source-trib-longitudinal-2017
    suggestedTargets: [screen-candidates, select-clinician]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      The direct prospective studies are relatively small and largely adult or training-clinic samples. Transfer to parent-focused, child, and family care should be tested rather than assumed, and a specific performance task should not be adopted merely because the construct is promising.
  - id: finding-static-resume-signals-weak
    statement: >
      Years of experience, training stage, highest qualification, theoretical orientation, demographic characteristics, and similar static resume variables are weak or inconsistent predictors of psychotherapy outcomes and should not be treated as clinician-quality rankings without prospective local validation.
    sourceIds:
      - source-therapist-effect-review-2026
      - source-effective-therapist-characteristics-2020
      - source-training-outcomes-2017
      - source-experience-outcomes-2016
      - source-deliberate-practice-2015
      - source-youth-therapist-factors-review-2023
    suggestedTargets: [screen-candidates, select-clinician]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      Some individual studies find effects for selected characteristics in selected settings. The finding is not that experience or training never matter, but that they are unreliable as general-purpose outcome rankings and can conceal subgroup or context interactions.
  - id: finding-competence-adherence-are-mixed-predictors
    statement: >
      Modality-specific competence and treatment adherence have inconsistent relationships with patient outcomes, including in youth psychotherapy, so demonstrated competence is better treated as evidence of capability or readiness unless the platform validates that a particular assessment predicts the quality domain it intends to rank.
    sourceIds:
      - source-youth-adherence-competence-meta-2020
      - source-routine-cbt-competence-2024
      - source-therapist-effect-review-2026
    suggestedTargets: [select-clinician, clinician-onboarding]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      Competence-outcome relationships vary by treatment, measurement method, setting, and patient group. Some narrower literatures report positive effects, so capability thresholds should remain treatment-specific rather than being generalized into one clinician-quality score.
  - id: finding-early-alliance-is-rapid-update-signal
    statement: >
      Once care begins, alliance and rapport provide an early update on the care-effectiveness-and-relationship domain and predict later outcomes across adult, youth, and family-involved psychotherapy, although the signal reflects both clinician and patient contributions.
    sourceIds:
      - source-alliance-predictors-2025
      - source-alliance-therapist-effects-2021
      - source-family-youth-alliance-2018
      - source-youth-therapist-factors-review-2023
    suggestedTargets: [matching, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      Alliance is not a pure clinician trait and should not be compared across clinicians without case and relationship context. In family care there can be multiple alliances with patient, parent, caregiver, and family system rather than one dyadic rating.
  - id: finding-historical-domain-performance-supports-matching
    statement: >
      Risk-adjusted historical performance by problem domain can identify contextual clinician strengths that improve future assignment decisions; in a randomized community mental-health trial, matching patients to therapists using empirically derived historical strengths improved symptomatic and functional outcomes.
    sourceIds:
      - source-strength-matching-rct-2021
      - source-domain-performance-2024
    suggestedTargets: [matching, quality-outcomes, select-clinician]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      The randomized trial was adult outpatient care and required historical outcome depth. It supports domain-specific performance as a matching signal, not a universal threshold for case count, risk adjustment, or transfer to parent-focused care.
  - id: finding-feedback-responsiveness-is-system-interaction
    statement: >
      Responsiveness to routine outcome feedback is a longitudinal clinician-system interaction signal rather than a static clinician trait because feedback systems can themselves improve outcomes and reduce differences between more and less effective therapists.
    sourceIds:
      - source-rom-review-2023
      - source-feedback-therapist-effects-2022
      - source-deliberate-practice-review-2025
    suggestedTargets: [quality-outcomes, clinician-onboarding]
    classification: new
    evidenceStance: contextualizes
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      Evidence supports the effect of feedback systems more strongly than the predictive value of an individual clinician's measured responsiveness to support. A platform should test whether response patterns predict later adaptive practice or operating reliability before using them for ranking.
notes:
  - id: matrix-prospect-prior-signals
    statement: >
      Prospect prioritization matrix row: licensure, scope, geography, languages, populations served, and other factual attributes are useful eligibility or contextual filters but are not established quality signals; years of experience, degree or qualification level, theoretical orientation, prestige, and self-rated social skill are cheap to collect but weak or inconsistent as outcome predictors. Use them to establish feasibility and context, not to create a top-clinician score.
    sourceIds: [source-therapist-effect-review-2026, source-effective-therapist-characteristics-2020, source-training-outcomes-2017, source-experience-outcomes-2016]
    anchors: [identify-predictive-selection-signals, screen-candidates]
  - id: matrix-precontract-performance-signals
    statement: >
      Pre-contract qualification matrix row: performance-based interpersonal responses to challenging clinical scenarios have the strongest direct pre-care predictive evidence found in this pass, with moderate collection burden; modality-specific role-play or competence assessment can establish capability but has mixed evidence as an outcome predictor; self-report remains lower burden and lower confidence.
    sourceIds: [source-effective-therapist-characteristics-2020, source-fis-prospective-2016, source-trib-longitudinal-2017, source-youth-adherence-competence-meta-2020, source-routine-cbt-competence-2024]
    anchors: [identify-predictive-selection-signals, select-clinician]
  - id: matrix-onboarding-signals
    statement: >
      Onboarding matrix row: verified facts can strengthen the contextual map, while observed use of platform workflows, correction of errors, uptake of feedback, and response to support are candidate signals for operating partnership or adaptive practice. The external psychotherapy literature does not establish these platform behaviors as clinical-quality predictors; they should be validated prospectively against the platform outcomes they are meant to predict and recorded with the support conditions that produced them.
    sourceIds: [source-rom-review-2023, source-feedback-therapist-effects-2022, source-deliberate-practice-review-2025]
    anchors: [identify-predictive-selection-signals, clinician-onboarding]
  - id: matrix-cold-start-matching-signals
    statement: >
      Cold-start matching matrix row: use verified contextual facts and only those pre-contract assessments that have survived validation, while keeping confidence low when longitudinal evidence is absent. If credible historical domain-specific outcomes exist from another compatible context they may be informative, but platform-specific performance should not be fabricated from resume similarity. Early alliance and experience signals can update the profile quickly after care starts.
    sourceIds: [source-strength-matching-rct-2021, source-alliance-predictors-2025, source-family-youth-alliance-2018]
    anchors: [identify-predictive-selection-signals, matching]
  - id: matrix-longitudinal-signals
    statement: >
      Longitudinal monitoring matrix row: risk-adjusted symptom and function trajectories, deterioration, patient or family alliance and experience, domain-specific performance, treatment completion patterns, adaptive response to feedback, and operating reliability can deepen the profile over time. Keep these outcomes separable, attach case mix and support context, and use historical performance prospectively rather than treating one favorable aggregate as global quality.
    sourceIds: [source-strength-matching-rct-2021, source-domain-performance-2024, source-alliance-therapist-effects-2021, source-family-youth-alliance-2018, source-rom-review-2023]
    anchors: [identify-predictive-selection-signals, quality-outcomes, matching]
  - id: matrix-operating-reliability-needs-local-validation
    statement: >
      Operating partnership reliability is the domain with the weakest transferable external prediction evidence. Documentation, scheduling accuracy, availability freshness, responsiveness, workflow completion, and support uptake are plausible platform-local signals, but their value should be judged against future operating outcomes and should not be allowed to stand in for care effectiveness.
    sourceIds: [source-therapist-effect-review-2026, source-rom-review-2023]
    anchors: [identify-predictive-selection-signals, design-trustworthy-clinician-selection, clinician-onboarding]
questions:
  - id: question-performance-task-transfer
    question: Which performance-based interpersonal or clinical-judgment assessment, if any, has enough predictive validity for parent-focused, child, and family behavioral health to justify candidate burden?
  - id: question-platform-prospective-validation
    question: What prospective holdout design should the platform use to test whether pre-contract and onboarding signals predict each quality domain without learning historical selection bias?
  - id: question-operating-reliability-target
    question: Which later operating outcomes should define successful operating partnership so onboarding and pre-contract signals can be validated against a real target rather than general convenience?
  - id: question-early-update-policy
    question: How much early-care alliance, experience, or outcome evidence should be required before the system changes a clinician's cold-start matching profile?
  - id: question-signal-fairness
    question: Which candidate signals are likely to encode access to training, prior platform opportunity, culture, language, demographic similarity, or historical case assignment and therefore require fairness constraints or exclusion from selection?
