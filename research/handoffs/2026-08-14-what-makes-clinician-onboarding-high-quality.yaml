findings:
  - id: finding-separate-readiness-from-downstream-outcomes
    statement: >
      Onboarding quality should be evaluated as an implementation and readiness construct distinct from downstream service and clinical outcomes, so later outcomes are not attributed to onboarding without an explicit causal basis.
    sourceIds: [source-proctor-implementation-outcomes]
    suggestedTargets: [clinician-onboarding, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: expert-opinion
    generalizedApplicability: true
    uncertainty: >
      This supports separating outcome classes, not a claim that onboarding can never influence later service or clinical outcomes; any such attribution still needs an explicit causal argument and evidence.
  - id: finding-readiness-includes-operating-environment
    statement: >
      Clinician onboarding can affect safe and effective practice through knowledge of local care logistics, support paths, emergency processes, and patient-scope boundaries; administrative setup alone does not establish operational readiness.
    sourceIds: [source-lagoo-physician-onboarding, source-hhs-telebehavioral-emergency-plan]
    suggestedTargets: [clinician-onboarding, become-match-ready]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      The empirical onboarding study concerned physicians entering unfamiliar hospitals, so the specific logistics and support paths that matter on a telebehavioral practice platform require context-specific evidence.
  - id: finding-demonstrate-critical-readiness
    statement: >
      For critical telehealth tasks, readiness is better supported by demonstrated performance against explicit competencies than by administrative completion or assumed preparedness alone.
    sourceIds: [source-maheu-telebehavioral-competencies, source-jiang-telemental-training-review, source-liew-telepsychiatry-simulation]
    suggestedTargets: [clinician-onboarding, become-match-ready]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      The evidence supports competency-based assessment in training contexts but does not establish a specific assessment method, pass threshold, or requirement to simulate every workflow for already licensed practicing clinicians. It also does not justify using onboarding as an unvalidated second screen of general clinical competence; any gate should distinguish platform-specific, safety-critical readiness from selection criteria and preserve remediation where appropriate.
  - id: finding-patient-facing-conditions-constrain-readiness
    statement: >
      Telehealth readiness spans patient safety, privacy, access and equity, patient preference, communication, technology, and legal or ethical practice, so a readiness definition limited to technical platform use or clinician-side completion is materially incomplete.
    sourceIds: [source-jacob-telehealth-competencies, source-maheu-telebehavioral-competencies, source-galvin-remote-mental-health, source-hhs-telebehavioral-emergency-plan]
    suggestedTargets: [clinician-onboarding, become-match-ready, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      Some patient-facing conditions belong partly to matching or care initiation rather than onboarding. The operating model should assign ownership explicitly instead of treating every later access or experience failure as an onboarding defect.
  - id: finding-separate-burden-from-speed-and-self-report
    statement: >
      Clinician experience and objective operating burden can move differently after training, so onboarding quality should track burden or rework separately from knowledge, satisfaction, and activation speed.
    sourceIds: [source-diangi-ehr-training]
    suggestedTargets: [clinician-onboarding, clinician-effort-to-activate, operating-effort-per-activation]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      The supporting study evaluated supplemental EHR training after clinicians had substantial system experience, so it supports separating measurement dimensions more strongly than it establishes which burden measures belong inside initial onboarding.
questions:
  - id: question-critical-match-ready-workflows
    question: "Which observable workflows are sufficiently safety-, access-, or quality-critical to gate match-ready status for practicing behavioral-health clinicians?"
  - id: question-readiness-gate-versus-remediation
    question: "When a clinician is not yet ready on an onboarding-specific capability, which failures should block matching, trigger remediation, or remain monitored without gating so onboarding does not become an unvalidated second selection screen?"
  - id: question-onboarding-attribution-window
    question: "Which post-activation defects are sufficiently proximal to onboarding to count as onboarding-quality signals, and where should attribution explicitly stop?"
  - id: question-correctness-versus-completeness
    question: "Which clinician attributes that affect matching or first-care execution require correctness checks rather than only completeness checks before a clinician becomes match-ready?"
