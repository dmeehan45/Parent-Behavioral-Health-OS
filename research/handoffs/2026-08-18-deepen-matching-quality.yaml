contractVersion: 1
run:
  id: 2026-08-18-deepen-matching-quality
  question: >
    What makes clinician-patient matching high quality under incomplete patient, clinician, relationship, and supply evidence; which signals can legitimately inform a particular pairing; and how should later care evidence improve future routing without collapsing match quality into acceptance, retention, or a clinician rank?
  synthesis: >
    The evidence supports treating matching as a multidimensional, uncertainty-bearing routing problem rather than a binary compatibility verdict or a clinician leaderboard. Engagement, alliance, clinical benefit, access, and continuity should remain distinguishable because preference accommodation can improve dropout and alliance without showing corresponding average clinical benefit. Historical problem-domain clinician performance can improve assignment when sufficiently observed, but this evidence is contextual and sparse at cold start rather than a general clinician score. In child and family care, patient, parent, and therapist perspectives do not collapse cleanly, so the system should preserve actor-specific evidence without defaulting authority to one participant. Early care can update dimension-specific beliefs about future fit, but it does not validate a binary match or imply mid-care reassignment. Finally, downstream learning must preserve the conditions under which observations became available because prior decisions and resource constraints can bias labels. Reviewer-supplied operating constraints about non-gamified clinician evidence, confidence visibility, and realistic data availability are retained as anchored context rather than represented as externally established findings.
  createdAt: 2026-08-18
  preparedBy:
    kind: conversational-agent
    provider: openai
    model: gpt-5.6-sol
  provenance:
    method: public-research
    context: >
      Deep research on clinician-patient matching was oriented from the current repository and pressure-tested conversationally with the accountable reviewer. Sources prioritize direct psychotherapy matching evidence, meta-analyses of preference and youth alliance, and primary clinical-ML work on label-selection bias. The handoff deliberately separates externally supported findings from reviewer-provided product and operating constraints.
