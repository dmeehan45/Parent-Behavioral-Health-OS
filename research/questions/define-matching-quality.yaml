id: define-matching-quality
question: "What makes a patient matching experience high quality for families, patients, clinicians, and the practice-management platform, and how can it be measured without hiding constrained access?"
askedBy: accountable-reviewer-2026-08-14
createdAt: 2026-08-14
status: open
priority: high
targets: [matching, propose-match, review-match, quality-outcomes]
why: >
  This is the umbrella question for matching quality. Speed and acceptance can hide poor fit, burden, inequitable access, constrained supply, rematching, and missing follow-up; the model needs actor-specific constructs and valid denominators. Current research should distinguish the matching objective, patient-side decision information, clinician-side predictive information, confidence and abstention, role-specific representations of confidence for patient, clinician, and system or operator, early validation and recovery, and the learning loop that updates future matching without encoding case mix or prior allocation bias.
