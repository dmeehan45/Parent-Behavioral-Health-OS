contractVersion: 1
run:
  id: matching-quality-2026-08-14-a
  question: "What makes a patient matching experience high quality for families, patients, clinicians, and the practice-management platform, and how can it be measured without hiding constrained access?"
  synthesis: >-
    Initial primary evidence argues against a single match-quality score. Matching quality appears to combine clinician-specific clinical effectiveness, verified access feasibility, stakeholder-specific fit and decision agency, and downstream confirmation after care begins. Youth and caregiver perspectives should not be collapsed, and demographic concordance alone should not be treated as a proxy for cultural or relational fit. This run does not establish the weighting of these dimensions or a final composite metric.
  createdAt: 2026-08-14
  preparedBy:
    kind: conversational-agent
    provider: openai
    model: GPT-5.6 Sol
  provenance:
    method: public-research
    context: Bounded first-pass search of five primary empirical studies chosen to test whether matching quality can be reduced to speed, acceptance, demographic similarity, or nominal provider eligibility. Raw transcript excluded.
  safety:
    containsSensitiveData: false
    containsPrivateCompanyMaterial: false
    rawTranscriptIncluded: false
  answers: [define-matching-quality]
