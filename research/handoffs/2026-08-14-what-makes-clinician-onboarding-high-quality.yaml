findings:
  - id: finding-separate-readiness-from-downstream-outcomes
    statement: >
      Onboarding quality should be evaluated as an implementation and readiness construct distinct from downstream service and clinical outcomes, so later outcomes are not attributed to onboarding without an explicit causal basis.
    sourceIds: [source-proctor-implementation-outcomes-review]
    suggestedTargets: [clinician-onboarding, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      The 2023 review supports separating outcome classes and reports that few studies have empirically tested links from implementation outcomes to service or clinical outcomes. This does not mean onboarding can never influence later outcomes; any attribution still needs an explicit causal argument and evidence.
  - id: finding-readiness-includes-operating-environment
    statement: >
      Clinician onboarding can affect safe and effective practice through knowledge of the local care environment, support paths, emergency processes, and patient-scope boundaries; administrative setup alone does not establish operational readiness.
    sourceIds: [source-lagoo-physician-onboarding, source-wiese-clinical-orientation, source-hhs-telebehavioral-emergency-plan]
    suggestedTargets: [clinician-onboarding, become-match-ready]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      The 2020 study is older than the preferred window for workflow-dependent evidence but was retained because it directly studied experienced physicians entering unfamiliar care environments; a newer 2022 clinical-orientation study and current HHS telebehavioral guidance point in the same direction. The exact workflows that matter on a behavioral-health practice platform still require context-specific evidence.
  - id: finding-demonstrate-critical-readiness
    statement: >
      For platform-specific or technology-enabled tasks where failure is consequential, administrative completion alone is weak evidence of readiness; demonstrated performance against explicit competencies can provide stronger evidence.
    sourceIds: [source-merrill-telebehavioral-social-work, source-jiang-telemental-training-review, source-liew-telepsychiatry-simulation]
    suggestedTargets: [clinician-onboarding, become-match-ready]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      The evidence supports competency-based assessment in training contexts but does not establish a specific assessment method, pass threshold, or requirement to simulate every workflow for already licensed practicing clinicians. It does not justify using onboarding as an unvalidated second screen of general clinical competence or as a substitute for longitudinal evidence about clinician quality; any gate should distinguish readiness for the new operating environment from selection criteria and preserve remediation where appropriate.
  - id: finding-patient-facing-conditions-constrain-readiness
    statement: >
      A clinician is not fully ready just because their account is configured; onboarding should prepare them for patient-facing safety, privacy, communication, technology, and access constraints that can reasonably be handled before matching or a first encounter.
    sourceIds: [source-jacob-telehealth-competencies, source-galvin-remote-mental-health, source-hhs-telebehavioral-emergency-plan]
    suggestedTargets: [clinician-onboarding, become-match-ready, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      Onboarding should not own every later access or experience outcome. Conditions created by a particular patient's needs or preferences, a specific match, or the later care relationship belong to matching or care initiation unless there is a clear onboarding dependency.
  - id: finding-separate-burden-from-speed-and-self-report
    statement: >
      Objective clinician operating burden can be measured separately from activation speed and subjective experience, so those signals should not be treated as interchangeable measures of onboarding quality.
    sourceIds: [source-sieja-ehr-training]
    suggestedTargets: [clinician-onboarding, clinician-effort-to-activate, operating-effort-per-activation]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      The study evaluated EHR optimization and training in an established practice rather than initial onboarding. It supports keeping objective burden conceptually separate more strongly than it supports adding a complex onboarding metric suite. A simple operational success measure can remain primary until burden or rework is needed as a balancing or diagnostic signal.
questions:
  - id: question-critical-match-ready-workflows
    question: "Which observable workflows are sufficiently safety-, access-, or quality-critical to gate match-ready status for practicing behavioral-health clinicians?"
  - id: question-readiness-gate-versus-remediation
    question: "When a clinician is not yet ready on an onboarding-specific capability, which failures should block matching, trigger remediation, or remain monitored without gating so onboarding does not become an unvalidated second selection screen?"
  - id: question-onboarding-attribution-window
    question: "Which post-activation defects are sufficiently proximal to onboarding to count as onboarding-quality signals, and where should attribution explicitly stop?"
  - id: question-correctness-versus-completeness
    question: "Which clinician attributes that affect matching or first-care execution require correctness checks rather than only completeness checks before a clinician becomes match-ready?"
  - id: question-minimal-onboarding-measurement
    question: "What is the smallest useful onboarding measurement set that lets the platform optimize a simple success metric first while adding burden, rework, or readiness dimensions only when they change a decision?"
