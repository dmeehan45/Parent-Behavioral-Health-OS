contractVersion: 1
run:
  id: 2026-08-17-clinician-quality-profile-reflection
  kind: reflection
  reflectsOn: [2026-08-16-define-clinician-quality]
  question: >
    How should clinician quality be represented as a longitudinal evidence profile that supports prospect prioritization, pre-contract qualification, onboarding, cold-start matching, later matching, and network support without treating quality as a static clinician trait?
  synthesis: >
    The working object is an evolving clinician evidence profile rather than six equal quality scores or a new operating stage. Three quality domains currently look separable enough to carry forward: care effectiveness and relationship, adaptive clinical practice, and operating partnership reliability. Contextual strength is a conditioning map across those domains rather than another scalar quality dimension. Learning responsiveness is split between adaptive clinical practice and operating partnership reliability. Every observation retains an attribution envelope that includes case mix, match conditions, platform configuration, workload, and the support or intervention the clinician received, plus an evidence-confidence envelope describing provenance, recency, sample depth, missingness, and uncertainty. Different lifecycle moments read different subsets of the same profile: cheap and explicitly weak priors for deciding whether deeper human evaluation is worthwhile, richer structured evidence during pre-contract qualification, verified and demonstrated evidence during onboarding, conservative cold-start matching context, and risk-adjusted longitudinal evidence for later matching, clinician support, training, and network operating decisions. The profile therefore spans supply, matching, care monitoring, and network optimization rather than belonging to any one stage.
  createdAt: 2026-08-17
  preparedBy:
    kind: conversational-agent
    provider: openai
    model: gpt-5.6-sol
  provenance:
    method: repository-reflection
    context: >
      Structured from accountable-reviewer feedback on the clinician-quality research run after re-orienting on current main and the repository's Research to Problem to Bet to Prototype to Learn loop. No new external evidence was gathered in this reflection.
  safety:
    containsSensitiveData: false
    containsPrivateCompanyMaterial: false
    rawTranscriptIncluded: false
