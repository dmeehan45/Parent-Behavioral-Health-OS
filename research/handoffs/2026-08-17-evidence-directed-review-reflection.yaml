contractVersion: 1
run:
  id: 2026-08-17-evidence-directed-review-reflection
  question: >
    What scope and experience constraints should carry into the first prototype for allocating scarce human review across clinician prospects?
  synthesis: >
    The first prototype should begin after a clinician prospect already exists rather than treating sourcing or inbound prospect generation as part of the same problem. Prospect generation remains a separate workstream. The prototype should test whether a comparable evidence profile and explicit next-step routing help operators allocate scarce review time, while treating clinician-facing automation as human-backed augmentation rather than replacement of a relational selection experience. Automated evidence collection may be useful, but the experience should preserve a visible human relationship, explain the bounded role of automation, and avoid positioning the system as an AI interviewer or autonomous contracting decision-maker.
  createdAt: 2026-08-17
  preparedBy:
    kind: conversational-agent
    provider: openai
    model: gpt-5.6-sol
  provenance:
    method: conversational-reflection
    context: >
      Structured from the accountable reviewer's reflection after the trustworthy-selection research run and before shaping the first Bet and prototype. It narrows prototype scope and records experience constraints; it does not add external evidence.
