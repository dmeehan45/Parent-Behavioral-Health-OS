id: identify-clinician-matching-information
question: "Which evidence already present or expected in the longitudinal clinician profile materially changes predicted appropriateness, outcomes, or continuity for a particular patient or problem; how should contextual strength, attribution context, and evidence confidence be projected into match-specific evidence; and what additional clinician-side information, if any, is uniquely required for matching?"
askedBy: accountable-reviewer-2026-08-15
createdAt: 2026-08-15
status: open
priority: high
targets: [clinician-onboarding, become-match-ready, matching, propose-match, quality-outcomes]
why: >
  The clinician-quality work now defines one evolving evidence profile that deepens from prospect priors through qualification, onboarding, cold-start matching, and longitudinal observed performance. Matching should consume that record rather than build a competing clinician profile or re-define what makes a clinician good. Research should identify which profile evidence changes the expected result for this patient, how cold-start and longitudinal evidence should differ, how case mix, match conditions, support context, recency, sample depth, missingness, provenance, and uncertainty travel into a match decision, and whether matching requires any clinician-side information not already justified elsewhere in the lifecycle.
