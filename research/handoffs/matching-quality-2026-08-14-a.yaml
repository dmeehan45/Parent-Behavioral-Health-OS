findings:
  - id: finding-clinician-specific-effectiveness
    statement: >-
      In an adult outpatient randomized trial, assigning patients using therapists' empirically measured strengths for the patients' presenting problem domains produced better 16-week symptom and functioning outcomes than assignment as usual, indicating that clinician-specific effectiveness can be a meaningful matching signal.
    sourceIds: [source-constantino-2021]
    suggestedTargets: [matching, propose-match, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    proposedClaim:
      id: claim-clinician-specific-effectiveness-can-inform-matching
      statement: Clinician-specific effectiveness for relevant problem domains can be a meaningful input to behavioral-health matching when reliable performance evidence exists.
    uncertainty: >-
      The trial involved adults in six community clinics and used a specific measurement system; it does not establish how to generalize the signal to youth, family care, new clinicians, or sparse-data settings.
  - id: finding-youth-care-is-multi-perspective
    statement: >-
      In a longitudinal youth outpatient study, youth-therapist and parent-therapist treatment-goal agreement related differently to later engagement, supporting separate measurement of youth and caregiver perspectives rather than one undifferentiated family-fit score.
    sourceIds: [source-yeh-2023]
    suggestedTargets: [matching, review-match, care-initiation, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    proposedClaim:
      id: claim-youth-care-match-quality-requires-separate-stakeholder-perspectives
      statement: In youth behavioral health, match quality should preserve youth and caregiver perspectives separately because their alignment with a clinician can differ and relate differently to engagement.
    uncertainty: >-
      This was observational and examined broad treatment-goal agreement after service entry, not prospective therapist selection or causal effects on clinical outcomes.
  - id: finding-decision-agency-is-distinct
    statement: >-
      A preliminary randomized trial of youth psychotherapy planning found that shared decision-making increased youth and caregiver involvement and reduced caregiver decisional conflict and regret without improving symptoms or engagement, indicating that decision-process quality is distinct from downstream clinical outcomes.
    sourceIds: [source-langer-2021]
    suggestedTargets: [matching, review-match, care-initiation, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    proposedClaim:
      id: claim-match-quality-includes-decision-agency
      statement: A high-quality matching experience should measure whether patients and caregivers can participate meaningfully in the decision, separately from whether the eventual treatment produces good outcomes.
    uncertainty: >-
      The trial was small and studied treatment planning rather than provider matching, so this supports a decision-quality dimension but not a specific matching workflow.
  - id: finding-demographic-concordance-is-not-sufficient
    statement: >-
      In a large youth mental-health sample, youth-therapist racial matching did not predict early treatment engagement while youth-reported therapist cultural understanding did, cautioning against using demographic concordance alone as a proxy for relational or cultural fit.
    sourceIds: [source-chu-2023]
    suggestedTargets: [matching, review-match, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    proposedClaim:
      id: claim-demographic-concordance-is-not-a-sufficient-fit-proxy
      statement: Demographic concordance alone should not be treated as sufficient evidence of cultural or relational fit in youth behavioral-health matching.
    uncertainty: >-
      Cultural understanding was reported after treatment began, so the study does not show that it can be predicted accurately before a match or that demographic concordance is never valuable for individual patients.
  - id: finding-verified-access-feasibility
    statement: >-
      A 2024 secret-shopper audit of Pennsylvania ACA mental-health networks found that nominal provider listings substantially overstated real access: among fully verified listings, appointments were available for only a minority and waits averaged about a month, showing that directory or network eligibility is not equivalent to feasible care access.
    sourceIds: [source-haeder-2025]
    suggestedTargets: [matching, propose-match, care-initiation]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    proposedClaim:
      id: claim-match-quality-requires-verified-access-feasibility
      statement: Match quality should include current, verified feasibility of starting care rather than treating directory membership or nominal network eligibility as evidence that a clinician is actually accessible.
    uncertainty: >-
      This audit studied insurer directories rather than an integrated practice platform with first-party clinician availability, so the size of the access gap may not transfer.
questions:
  - id: question-hard-vs-soft-match-constraints
    question: "Which matching-quality dimensions should be hard eligibility constraints, which should rank otherwise viable matches, and which should only be monitored after care begins?"
  - id: question-match-quality-denominator
    question: "What denominator should matching-quality metrics use so never-proposed, declined, expired, unmatched, and rematched demand remains visible?"
  - id: question-match-quality-confirmation-window
    question: "At what point should the system treat a match as provisionally or retrospectively high quality: proposal, acceptance, first encounter, early engagement, or later outcome?"
  - id: question-stakeholder-disagreement
    question: "How should the matching process represent disagreement among youth, caregivers, and clinicians without collapsing their preferences or assuming equal decision authority?"
