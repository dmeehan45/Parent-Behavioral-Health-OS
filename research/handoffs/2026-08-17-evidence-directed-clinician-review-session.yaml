findings:
  - id: finding-prototype-lacks-action-hierarchy
    statement: >
      The operator could not quickly determine what to do next because route explanation, disclaimers, evidence details, unknowns, and reviewer actions were all presented at similar visual weight instead of being progressively disclosed around the immediate decision.
    sourceIds: [source-review-session]
    suggestedTargets: [screen-candidates, select-clinician, scarce-review-time-without-comparable-evidence]
    classification: new
    evidenceStance: contextualizes
    evidenceQuality: primary
    generalizedApplicability: false
    uncertainty: >
      This is one reviewer using a synthetic prototype. It is strong evidence of an interaction defect in this artifact, not evidence that every operator would experience the same confusion.
  - id: finding-review-queue-needs-workflow-location
    statement: >
      The prototype did not establish what state a prospect is in when they enter the review queue, what work has already happened, or what operational state each route hands off to, making the routing labels difficult to evaluate as real workflow decisions.
    sourceIds: [source-review-session]
    suggestedTargets: [screen-candidates, select-clinician, selection-complete]
    classification: new
    evidenceStance: contextualizes
    evidenceQuality: primary
    generalizedApplicability: false
    uncertainty: >
      The canonical model already distinguishes screening from deeper selection, but the prototype has not yet proven the exact product boundary or whether this review queue is one screen, several screens, or a background routing service.
  - id: finding-route-outcomes-are-not-yet-operationally-legible
    statement: >
      The reviewer could distinguish the labels Can progress, Needs one detail, Human review, and Eligibility stop, but could not tell what each outcome meant in terms of who acts next, what evidence or decision is produced, or whether the operator should focus only on the human-review cases.
    sourceIds: [source-review-session]
    suggestedTargets: [screen-candidates, select-clinician]
    classification: new
    evidenceStance: contextualizes
    evidenceQuality: primary
    generalizedApplicability: false
    uncertainty: >
      Some confusion may disappear once the surrounding workflow and handoff states are shown; this session does not establish that the four-route model itself is wrong.
  - id: finding-evidence-request-preview-does-not-read-as-clinician-facing
    statement: >
      When the reviewer opened the evidence-request preview, it was not immediately obvious that the surface represented what the clinician would see, so the prototype could not yet support a credible judgment about whether the clinician experience felt human-backed or automated.
    sourceIds: [source-review-session]
    suggestedTargets: [select-clinician, clinician]
    classification: new
    evidenceStance: contextualizes
    evidenceQuality: primary
    generalizedApplicability: false
    uncertainty: >
      The current preview contains a named human contact and technology-boundary language, but those cues were visually subordinate enough that the reviewer did not recognize the perspective switch at first.
  - id: finding-human-backed-evidence-request-is-next-useful-prototype-focus
    statement: >
      The choice between supplying a bounded missing detail asynchronously before a human call and handling the same question with the named human during the call is concrete enough to deepen next, and appears more useful to test than adding more route explanation or override mechanics to the current dense screen.
    sourceIds: [source-review-session]
    suggestedTargets: [select-clinician, evidence-directed-clinician-review]
    classification: new
    evidenceStance: contextualizes
    evidenceQuality: primary
    generalizedApplicability: false
    uncertainty: >
      This is a product-design implication from one review session. It has not yet been tested with clinicians or operations reviewers and should remain a prototype hypothesis.
notes:
  - id: note-canonical-workflow-anchor
    statement: >
      The current canonical supply flow already places Screen Candidates before Evaluate & Select, with screening intended to protect expensive human judgment and Evaluate & Select applying deeper judgment before Selection Complete hands the clinician into onboarding.
    sourceIds: []
    anchors: [screen-candidates, select-clinician, selection-complete]
questions:
  - id: question-review-queue-entry-state
    question: >
      What exact prospect state and minimum evidence package should enter the evidence-directed review queue after screening?
  - id: question-route-handoff-states
    question: >
      What explicit downstream state, owner, and next action should each route produce: progress, request evidence, human review, or eligibility stop?
  - id: question-human-backed-evidence-request
    question: >
      How should a targeted clinician evidence request divide asynchronous collection from a named human interaction so the process saves reviewer time without replacing the relational experience?
