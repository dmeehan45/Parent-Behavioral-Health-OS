findings:
  - id: finding-clinician-quality-is-multidimensional
    statement: >
      Clinician quality is better represented as a multidimensional performance profile than as a single rank: patient improvement, relational and interpersonal effectiveness, evidence-based adaptive practice, and patient-reported experience describe distinct aspects of care, and therapist performance can differ across outcome types.
    sourceIds:
      - source-apa-evidence-based-practice
      - source-therapist-effect-review-2026
      - source-janse-multiple-outcomes-2024
      - source-ahrq-outpatient-mental-health
    suggestedTargets: [clinician-supply, select-clinician, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: secondary
    generalizedApplicability: true
    uncertainty: >
      The evidence base is strongest for adult psychotherapy and does not establish one universally correct dimension set for parent-focused or family behavioral health. Patient experience measures also include system-level influences that are not solely clinician-attributable.
  - id: finding-clinician-outcomes-require-attribution
    statement: >
      Observed patient outcomes should not be treated as direct clinician quality without case-mix and operating-context adjustment because patient severity and other case characteristics change therapist estimates, while clinic-level effects remain after therapist effects are modeled.
    sourceIds:
      - source-mahon-therapist-clinic-variance
      - source-kilcullen-case-mix-2026
    suggestedTargets: [select-clinician, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      Existing studies adjust for selected observed variables rather than proving that all relevant confounding has been removed. The necessary case-mix variables may differ substantially for children, caregivers, family systems, acuity, and access constraints.
  - id: finding-clinician-strengths-can-be-contextual
    statement: >
      Clinician effectiveness can be conditional on the problem or outcome domain rather than globally high or low; historical multidimensional performance profiles identify distinct therapist strengths and weaknesses, and a randomized trial found better outcomes when patients were assigned using empirically derived domain-specific therapist strengths.
    sourceIds:
      - source-janse-multiple-outcomes-2024
      - source-constantino-matching-rct-2021
    suggestedTargets: [select-clinician, matching, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      The randomized evidence comes from adult outpatient psychotherapy in one community system. It supports contextual performance as a useful signal but does not establish that the same domains, thresholds, or matching logic transfer directly to parent-focused care.
  - id: finding-performance-estimates-need-reliability-context
    statement: >
      Clinician-level performance estimates should carry case count, outcome coverage, risk-adjustment method, and uncertainty rather than being treated as equally reliable; published therapist-effect and matching studies use minimum historical case thresholds and interval estimates, but they do not establish one universal minimum sample size.
    sourceIds:
      - source-mahon-therapist-clinic-variance
      - source-constantino-matching-rct-2021
    suggestedTargets: [select-clinician, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      Minimum episode counts in these studies are study-design choices, not validated platform thresholds. Reliability will depend on outcome prevalence, domain granularity, missingness, case mix, and the consequence of the decision being made.
  - id: finding-performance-dimensions-do-not-collapse
    statement: >
      Therapist performance across symptom change, dropout, treatment duration, referrals, and client satisfaction does not move as one dimension, so collapsing clinical outcomes and platform-operating outcomes into a single quality score can obscure materially different performance profiles.
    sourceIds:
      - source-janse-multiple-outcomes-2024
    suggestedTargets: [select-clinician, quality-outcomes]
    classification: new
    evidenceStance: supports
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      The study is exploratory and observational. It supports keeping dimensions separable; it does not establish which operational dimensions should be optimized or how they should be weighted in a marketplace.
  - id: finding-proprietary-data-should-predict-not-define-quality
    statement: >
      A scaled platform can use proprietary longitudinal data to estimate clinician-specific strengths, but the defensible pattern is to define outcomes independently, risk-adjust historical performance, quantify domain-specific clinician effects with uncertainty, and test whether those signals prospectively improve later decisions; similarity to historically successful clinicians is not itself evidence of quality.
    sourceIds:
      - source-constantino-matching-rct-2021
      - source-mahon-therapist-clinic-variance
      - source-kilcullen-case-mix-2026
    suggestedTargets: [select-clinician, quality-outcomes]
    classification: new
    evidenceStance: contextualizes
    evidenceQuality: primary
    generalizedApplicability: true
    uncertainty: >
      The prospective trial tested outcome-based matching, not pre-selection look-alike models. Applying this pattern to clinician qualification requires separate validation and fairness analysis because historical platform data can encode prior selection, access, matching, support, and follow-up biases.
notes:
  - id: note-interpersonal-skills-are-promising
    statement: >
      A 2026 review of reviews found the evidence for specific therapist characteristics mixed, with interpersonal qualities and skills showing the most consistent associations with outcomes.
    sourceIds: [source-therapist-effect-review-2026]
    anchors: [identify-predictive-selection-signals]
  - id: note-alliance-has-therapist-contribution
    statement: >
      A multilevel meta-analysis supports a therapist contribution to the alliance-outcome relationship after accounting for several measured covariates.
    sourceIds: [source-alliance-therapist-effects-2021]
    anchors: [identify-predictive-selection-signals, quality-outcomes]
  - id: note-routine-outcome-monitoring-can-generate-useful-signal
    statement: >
      Routine outcome monitoring and feedback can improve average psychotherapy outcomes and provides a practical mechanism for generating longitudinal patient-reported signal, but using the process is not itself proof that an individual clinician is high quality.
    sourceIds: [source-rom-review-2023]
    anchors: [quality-outcomes, identify-predictive-selection-signals]
  - id: note-patient-experience-is-measurable-but-not-pure-attribution
    statement: >
      AHRQ outpatient mental-health experience measures include clinician communication, perceived improvement, treatment options, access barriers, and between-appointment help, offering a measurement menu whose items vary in how directly they can be attributed to the clinician.
    sourceIds: [source-ahrq-outpatient-mental-health]
    anchors: [quality-outcomes, define-clinician-quality]
questions:
  - id: question-safety-as-clinician-quality
    question: How should safety and clinical appropriateness be measured at clinician level when serious adverse events are rare and attribution is difficult?
  - id: question-parent-family-case-mix
    question: Which case-mix variables are necessary to compare clinician outcomes fairly in parent, child, and family behavioral health rather than adult outpatient psychotherapy?
  - id: question-performance-reliability-threshold
    question: What episode counts and outcome coverage are required for sufficiently reliable clinician-level estimates by problem or population domain on this platform?
  - id: question-missing-outcome-bias
    question: How should missing outcomes, early attrition, and selective follow-up be handled so clinician performance estimates do not reward easier-to-observe or easier-to-retain cases?
  - id: question-proprietary-model-fairness
    question: How should proprietary clinician prediction models be audited for historical selection, access, matching, and support bias before they influence qualification or selection?
