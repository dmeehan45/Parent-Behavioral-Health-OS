notes:
  - id: note-stage-arrows-hide-cross-stage-process
    statement: >
      The Step graph already carries cross-stage work that the top-level stage map compresses into a single arrow or omits entirely. In particular, `select-clinician` hands to `selection-complete`, `review-match` hands to `plan-first-encounter`, `confirm-care-continuation` hands to `reach-operating-rhythm`, and `reach-operating-rhythm` hands directly to `reach-sustainable-caseload` in Retention & Growth.
    sourceIds: [source-current-process, source-current-map]
    anchors: [clinician-supply, clinician-onboarding, matching, care-initiation, practice-operations, retention-growth]
  - id: note-care-initiation-has-authored-rematch-paths
    statement: >
      Care Initiation already contains authored recovery semantics rather than only forward movement. Planning, completing, and confirming the first care transition all preserve reasons for failure and can route toward rematching or a new proposal, so a Care Initiation to Matching return path can be shown without inventing a hypothetical loop.
    sourceIds: [source-current-process]
    anchors: [care-initiation, matching, plan-first-encounter, complete-first-encounter, confirm-care-continuation]
  - id: note-quality-stage-behaves-like-learning-system
    statement: >
      Quality & Outcomes is described canonically as observation and interpretation that should feed useful signals back into the operating system. At the same time, the process graph carries a direct Practice Operations to Retention & Growth transition. The current model therefore does not yet establish that Quality & Outcomes is a mandatory sequential gate between operating care and retention.
    sourceIds: [source-current-process, source-quality-stage, source-current-map]
    anchors: [practice-operations, quality-outcomes, retention-growth]
  - id: note-experience-is-present-as-concern-not-handoff-object
    statement: >
      Participant experience is visible today through roles, mutual acceptance and continuation decisions, exception handling, and research questions about burden, authority, and matching quality, but the model does not define what experience context itself persists from one stage to the next. Painting an experience payload on every boundary would therefore overstate current knowledge.
    sourceIds: [source-current-process, source-questions]
    anchors: [define-family-patient-caregiver-authority, define-matching-quality, matching, care-initiation]
  - id: note-existing-problems-already-bind-important-boundaries
    statement: >
      The connection view should reuse canonical Problems rather than invent a second handoff-problem system. `activation-without-productivity` already spans Onboarding and Matching, while `clinician-performance-loses-context` spans Onboarding, Matching, and Quality & Outcomes and directly describes context that must survive a learning loop.
    sourceIds: [source-problems]
    anchors: [activation-without-productivity, clinician-performance-loses-context, clinician-onboarding, matching, quality-outcomes]
  - id: note-existing-research-covers-several-boundary-unknowns
    statement: >
      Selection-to-onboarding persistence, matching quality, and changing family or patient authority already have queued questions. New map work should link those questions during research review rather than create near-duplicate questions merely because the same uncertainty becomes visually obvious on a handoff.
    sourceIds: [source-questions]
    anchors: [define-selection-handoff, define-matching-quality, define-family-patient-caregiver-authority]
candidates:
  - id: candidate-quality-topology-role
    kind: question
    description: >
      Should Quality & Outcomes remain a sequential operating stage, become a cross-cutting observation and learning layer, or intentionally be both, given the direct Practice Operations to Retention & Growth process path and the stage's feedback responsibilities to earlier decisions?
    rationale: >
      The canonical stage prose and canonical process topology currently imply different structural roles. Resolving that ambiguity would change how later connections are represented, so it should be investigated before redesigning the stage model around either interpretation.
  - id: candidate-minimum-handoff-contract
    kind: question
    description: >
      What minimum boundary contract should every stage connection be able to represent across operating trigger, transferred state or information, participant experience, ownership, failure or rework, and learning without duplicating the canonical Step and Entity model?
    rationale: >
      The current projection can derive process and state for some boundaries, but not every important kind of transfer. A small explicit contract would let the map deepen consistently without turning handoffs into a second source of truth.
  - id: candidate-demand-supply-information-payload
    kind: question
    description: >
      What specific information should the authored Family Demand to Clinician Supply `informs` relationship carry, at what level of aggregation and freshness, and which supply decisions is it permitted to change?
    rationale: >
      The relationship is already canonical but its payload is not. Researching the payload is more useful than drawing a generic data arrow that cannot say what information actually influences supply work.
  - id: candidate-quality-feedback-payload
    kind: question
    description: >
      For feedback from Quality & Outcomes into clinician supply, onboarding, and matching, what signal payload, attribution context, latency, confidence, and permitted decision use are required so that the system learns without turning system-produced outcomes into static clinician traits?
    rationale: >
      Existing research already warns about attribution and context loss. This question narrows that concern to the contract a feedback edge would need before the map can show a real learning payload rather than only the existence of a loop.
  - id: candidate-experience-boundary-persistence
    kind: question
    description: >
      Which participant-experience context, if any, must persist across stage boundaries rather than be re-collected locally, and how can the model distinguish an experience signal from a preference, consent decision, operational state, or outcome measure?
    rationale: >
      Experience is central to the intended operating system but is not yet a defined handoff object. This question is meant to prevent the visual layer from creating a vague experience payload before the model can say what should actually persist.
