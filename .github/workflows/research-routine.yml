name: Research routine

# Twice a day, publish what the loop should pick up next.
#
# This job holds no model key and calls no provider. It runs the repository's
# own `research:queue` and `prototype:queue` commands and keeps a single issue
# up to date with the result, so a person — or a conversational agent connected
# through a GitHub connector — has one place to open and one thing to do next,
# on either half of the loop.
#
# Deliberately not: a runner that does the research. That would need a provider
# credential, which is the thing this whole arrangement is built to avoid. The
# research happens in a conversation; this only says what is worth researching.

on:
  schedule:
    # 08:00 and 20:00 UTC. Cron here is always UTC.
    - cron: "0 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: research-routine
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read the queue
        id: queue
        run: |
          set -euo pipefail
          npm run --silent research:queue > queue.txt
          cat queue.txt

      # The brief goes in the issue because the agent that reads the issue
      # cannot produce it. A GitHub connector writes files through the contents
      # API and does not execute Node, so "run `research:brief` first" asked for
      # something impossible — and the brief is the step that keeps runs
      # separate. A run that skips it restates what an earlier run found, and
      # validation rejects that. This job already has a checkout and a Node, so
      # it computes the brief and hands it over.
      - name: Brief the top of the queue
        run: |
          set -euo pipefail
          top="$(npm run --silent research:queue -- --top)"
          if [ -z "$top" ]; then
            echo "No new research run is admitted. Read the queue for the next knowledge action."
            exit 0
          fi
          printf '%s' "$top" > top.txt
          npm run --silent research:brief -- "$top" > brief.txt
          cat brief.txt

      # The build half of the loop. Unlike the research brief, nothing is
      # folded: building needs a coding agent that can run commands, and that
      # agent runs `prototype:brief` itself. The queue is here so the state —
      # a bet ready to build, a stamp a person owes, a prototype waiting for
      # participants — is visible without a checkout.
      - name: Read the build queue
        run: |
          set -euo pipefail
          npm run --silent prototype:queue > builds.txt
          cat builds.txt

      - name: Publish it to the routine issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const queue = fs.readFileSync("queue.txt", "utf8");
            const read = (file) => (fs.existsSync(file) ? fs.readFileSync(file, "utf8").trim() : "");
            const top = read("top.txt");
            const brief = read("brief.txt");
            const builds = read("builds.txt");

            const marker = "<!-- research-routine -->";
            const body = [
              marker,
              "## What the knowledge loop needs next",
              "",
              top
                ? `Top research question: **${top}**. Its brief is below — read it before researching.`
                : "No new research run is admitted right now. The queue below says whether the next action is review, writing, or question triage.",
              "",
              "Commit the handoff and nothing else. The review packet is derived, and CI renders it onto the",
              "pull request. `docs/research-workflow.md` describes the loop; `docs/research-practice.md` the craft.",
              "",
              "```text",
              queue.trim(),
              "```",
              "",
              // Folded, because the brief is longer than the queue and only the
              // run that is about to start needs to read all of it.
              ...(brief
                ? ["<details>", `<summary><b>Brief: ${top}</b></summary>`, "", "```text", brief, "```", "", "</details>", ""]
                : []),
              ...(builds
                ? [
                    "## What to build, check, or review",
                    "",
                    "Building runs through `docs/prototype-workflow.md`, starting from `npm run prototype:brief`.",
                    "Stamping a build and deciding what a session taught stay with a person.",
                    "",
                    "```text",
                    builds,
                    "```",
                    "",
                  ]
                : []),
              `_Refreshed ${new Date().toISOString().slice(0, 16).replace("T", " ")} UTC. This issue is rewritten in place, not reopened._`,
            ].join("\n");

            const { owner, repo } = context.repo;
            // One issue, rewritten. A new issue every twelve hours would bury
            // the repository in a queue nobody reads.
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:body "${marker}"`,
            });
            const found = existing.data.items[0];
            const title = "Routine: what to research, build, or review next";
            if (found) {
              await github.rest.issues.update({ owner, repo, issue_number: found.number, title, body });
              core.info(`Updated #${found.number}`);
              return;
            }
            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
            });
            core.info(`Opened #${created.data.number}`);
