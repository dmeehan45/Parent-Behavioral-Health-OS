contractVersion: 1
run:
  id: 2026-08-17-design-trustworthy-clinician-selection
  question: >
    How should a clinician network with limited reviewer capacity sequence prospect generation, evidence capture, automated qualification, and human evaluation so that scarce human judgment is spent where it adds the most decision value, without weakening selection quality or clinician trust?
  synthesis: >
    The evidence supports a progressive selection system rather than either full manual review or an automated ranking pipeline. Cheap stages should establish true eligibility and collect comparable evidence; stronger structured assessments should be reserved for fewer candidates; and evidence should be combined with explicit rules rather than free-form reviewer intuition. Multiple-hurdle systems can save assessment cost but can also discard useful compensating evidence, so early knockout rules should be limited to noncompensable requirements or predictors validated for that exact use. Structured interviews are among the strongest general personnel-selection procedures in updated meta-analytic evidence, while mechanical combination of multiple signals generally predicts outcomes better than holistic expert synthesis. Candidate reactions are not cosmetic: fairness, job relevance, explanations, and opportunity to demonstrate capability influence organizational attractiveness and willingness to accept offers. Recent field evidence also suggests that AI can improve standardized information collection without replacing the human hiring decision, but the result is not yet generalizable to clinician selection. The resulting design implication for this operating system is to use automation primarily to gather, normalize, verify, and route evidence; reserve human review for consequential ambiguity and high-value cases; and audit every consequential screening rule for predictive validity, false negatives, group effects, and candidate burden.
  createdAt: 2026-08-17
  preparedBy:
    kind: conversational-agent
    provider: openai
    model: gpt-5.6-sol
  provenance:
    method: public-research
    context: >
      Conducted after the repository made scarce-review-time-without-comparable-evidence a canonical pre-contract Problem and after the predictive-signal research run established that static resume variables are weak or inconsistent general quality rankings. This run focuses on sequencing and allocation of review effort, not on redefining clinician quality or selecting a final prototype design.
