contractVersion: 1
run:
  id: 2026-08-16-define-clinician-quality
  question: >
    What dimensions constitute high-quality clinician performance, which are reasonably attributable to the clinician rather than case mix, matching, or operating environment, and how should external evidence be combined with proprietary platform signals without defining quality circularly?
  synthesis: >
    The evidence does not support treating clinician quality as one stable rank. A more defensible model is a multidimensional, uncertainty-bearing performance profile. Patient improvement, relational effectiveness, patient experience, and operational outcomes capture different constructs; clinician effects coexist with case-mix and clinic effects; and therapists can show different strengths across problem or outcome domains. A scaled platform can learn from its own longitudinal data, but the stronger pattern is to define outcomes independently, risk-adjust historical performance, estimate domain-specific strengths with explicit uncertainty, and test whether those signals improve future decisions. Resemblance to historically successful clinicians, retention, availability, or other platform-favored operating metrics is not by itself evidence of clinical quality.
  createdAt: 2026-08-16
  preparedBy:
    kind: conversational-agent
    provider: openai
    model: gpt-5.6-sol
  provenance:
    method: public-research
    context: >
      Synthesized after an orientation and deep-research conversation about clinician quality in a scaled behavioral-health platform. Public evidence was re-checked for traceability before intake. Raw conversation and private company material are excluded.
  safety:
    containsSensitiveData: false
    containsPrivateCompanyMaterial: false
    rawTranscriptIncluded: false
  answers: [define-clinician-quality]
